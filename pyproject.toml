[project]
name = "docxforge"
version = "0.2.0"
description = "Forge styled DOCX documents from Markdown using any template"
requires-python = ">=3.10"
dependencies = ["python-docx>=1.2.0"]

[project.scripts]
docxforge = "docxforge.cli:_main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docxforge"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
